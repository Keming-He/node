name: Publish verified subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: [Collect, Refresh]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verified-subscriptions-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout publisher and Mihomo
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools/publish_verified.py
            tools/test_publish_verified.py
            clash/clash-linux-amd
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install PyYAML

      - name: Verify export invariants
        run: python -m unittest discover -s tools -p test_publish_verified.py

      - name: Test and publish both subscriptions
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_LINK: ${{ secrets.GIST_LINK }}
        run: |
          chmod +x clash/clash-linux-amd
          python -u tools/publish_verified.py \
            --core clash/clash-linux-amd \
            --output-dir "$RUNNER_TEMP/verified-subscriptions" \
            --publish
